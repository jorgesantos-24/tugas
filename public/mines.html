<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d0b">
<link rel="icon" type="image/png" href="img/favicon.png">
<title>Mines — TugasBet</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="decola.css">
<link rel="stylesheet" href="mines.css">
</head>
<body class="dc-body mn-body">

<header class="topbar">
  <a class="logo" href="/"><img src="img/logo.png" alt="TugasBet" class="logo-img"></a>
  <nav class="topnav">
    <a href="/">Esportes</a>
    <a href="/#cassino" class="active">Cassino</a>
  </nav>
  <div class="wallet" id="wallet"></div>
</header>

<div class="dc-test" id="testBar" hidden>TESTE LOCAL · saldo de teste nos emuladores do Firebase · nada aqui é dinheiro real</div>

<main class="dc mn">
  <section class="mn-game">
    <div class="mn-controls" id="controls"></div>

    <div class="mn-stage">
      <div class="mn-top">
        <div class="mn-stat"><small>Multiplicador</small><b id="multNow">1,00x</b></div>
        <div class="mn-stat"><small>Próxima casa</small><b id="multNext">—</b></div>
        <div class="mn-stat"><small>Prêmio</small><b id="payNow">—</b></div>
        <button class="dc-sound mn-sound" id="soundBtn" title="Som"></button>
      </div>
      <div class="mn-board" id="board"></div>
      <div class="mn-fx" id="fx"></div>
      <div class="mn-ladder" id="ladder"></div>
    </div>
  </section>

  <aside class="dc-side">
    <div class="dc-tabs mn-tabs" id="sideTabs">
      <button data-side="all" class="active">Todas</button>
      <button data-side="my">Minhas</button>
      <button data-side="top">Top</button>
    </div>
    <div class="dc-side-head" id="sideHead"></div>
    <div class="dc-sidebody" id="sideBody"></div>
    <button class="dc-fair-btn" id="fairBtn">🔒 Jogo verificável: como funciona</button>
  </aside>
</main>

<footer class="footer">
  <div class="footer-in">
    <div><span class="age">18+</span> Jogue com responsabilidade. Proibido para menores de 18 anos.</div>
    <div class="footer-links"><a href="/termos">Termos de uso</a><a href="/jogo-responsavel">Jogo responsável</a><span id="certInfo"></span></div>
  </div>
</footer>

<div class="overlay" id="overlay"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts"></div>

<script src="mines.js"></script>
</body>
</html>
