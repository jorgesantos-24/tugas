<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/img/favicon.png">
<title>Tugas — Apostas Esportivas</title>

<body>

<header class="topbar">
  <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu">☰</button>
  <a class="logo" href="/" id="logoLink"><img src="/img/logo.png" alt="TugasBet" class="logo-img"></a>
  <nav class="topnav">
    <a href="/" data-view="home" class="active">Esportes</a>
    <a href="/ao-vivo" data-view="live"><span class="live-dot"></span>Ao Vivo <b id="liveCountNav">0</b></a>
    <a href="/minhas-apostas" data-view="mybets">Minhas Apostas</a>
  </nav>
  <div class="search"><input id="search" placeholder="Buscar time ou liga..." autocomplete="off"></div>
  <div class="wallet" id="wallet"></div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main" id="main">
    <div class="skeleton" id="skeleton">
      <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
    </div>
  </main>

  <aside class="slip" id="slip">
    <div class="slip-tabs">
      <button class="active" data-tab="slip">Boletim <span class="badge" id="slipCount">0</span></button>
      <button data-tab="open">Apostas abertas <span class="badge" id="openCount">0</span></button>
    </div>
    <div id="slipBody"></div>
  </aside>
</div>

<!-- barra de baixo (telemóvel): Esportes · Ao vivo · Depósito (destaque) · Perfil (o SAC fica no Perfil) -->
<nav class="bottomnav" id="bottomNav" aria-label="Menu principal">
  <a href="/" class="bn-item" data-view="home" data-bn="home">
    <span class="bn-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l4.3 3.1-1.6 5H9.3l-1.6-5z"/><path d="M12 3v4.5M20.6 9.2l-4.3 1.4M17.3 19.4l-2.6-3.8M6.7 19.4l2.6-3.8M3.4 9.2l4.3 1.4"/></svg></span>Esportes</a>
  <a href="/ao-vivo" class="bn-item" data-view="live" data-bn="live">
    <span class="bn-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg><b class="bn-badge" id="liveCountBn"></b></span>Ao Vivo</a>
  <button type="button" class="bn-item bn-main" data-action="deposit">
    <span class="bn-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Depósito</button>
  <button type="button" class="bn-item" data-action="account" data-bn="account">
    <span class="bn-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Perfil</button>
</nav>

<button class="slip-fab only-mobile" id="slipFab">Boletim <span class="badge" id="slipFabCount">0</span> <span id="slipFabOdds"></span></button>

<footer class="footer">
  <div class="footer-in">
    <div><span class="age">18+</span> Jogue com responsabilidade. Proibido para menores de 18 anos.</div>
    <div class="footer-links"><a href="/termos">Termos de uso</a><a href="/privacidade">Privacidade</a><a href="/jogo-responsavel">Jogo responsável</a><a href="/sac.html">Atendimento (SAC)</a><span id="siteInfo"></span></div>

  </div>
</footer>

<div class="overlay" id="overlay"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts"></div>

<script src="/markets.js"></script>
<script src="/bbengine.js"></script>
<script src="/app.js"></script>
<script src="/whatsapp.js"></script>

</html>
