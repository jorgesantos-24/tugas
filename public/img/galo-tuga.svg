<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- Galo Tuga: mascote da TugasBet (inspirado no Galo de Barcelos) -->
  <defs>
    <linearGradient id="gtBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
    <linearGradient id="gtGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#f5a400"/></linearGradient>
    <linearGradient id="gtRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b4e"/><stop offset="1" stop-color="#c8102e"/></linearGradient>
  </defs>

  <!-- cauda -->
  <path d="M128 112c18-30 38-52 50-86-22 10-38 34-52 58z" fill="#151515"/>
  <path d="M132 120c24-18 46-30 62-56-26 4-46 24-64 44z" fill="#1f1f1f"/>
  <path d="M130 132c26-6 46-4 64-22-24-4-44 4-64 14z" fill="#151515"/>
  <path d="M136 96c12-20 24-36 34-56" stroke="#c8102e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M140 112c16-12 30-22 42-38" stroke="#ffcc1f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M140 126c16-4 30-6 44-16" stroke="#00843d" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- pernas -->
  <ellipse cx="104" cy="204" rx="54" ry="7" fill="#000" opacity=".25"/>
  <path d="M86 160v30M110 160v30" stroke="#f5b400" stroke-width="7" stroke-linecap="round"/>
  <path d="M76 194l10-4 10 4M100 194l10-4 10 4" stroke="#f5b400" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- corpo -->
  <ellipse cx="100" cy="124" rx="46" ry="42" fill="url(#gtBody)"/>
  <!-- desenhos do Galo de Barcelos -->
  <path d="M100 116c-6-10-20-6-18 4 2 8 18 16 18 16s16-8 18-16c2-10-12-14-18-4z" fill="#c8102e"/>
  <circle cx="74" cy="140" r="5" fill="#ffcc1f"/>
  <circle cx="126" cy="140" r="5" fill="#00843d"/>
  <circle cx="100" cy="152" r="3.5" fill="#ffcc1f"/><circle cx="88" cy="150" r="2.5" fill="#00843d"/><circle cx="112" cy="150" r="2.5" fill="#c8102e"/>
  <!-- asa -->
  <path d="M120 112c14 4 20 18 14 30-10-2-18-10-20-22z" fill="#2e2e2e"/>
  <path d="M124 120c6 4 8 10 6 16" stroke="#00843d" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- cachecol verde e vermelho -->
  <path d="M60 86c22 12 50 12 72 0l4 14c-26 14-54 14-80 0z" fill="#00843d"/>
  <path d="M90 92h12v8H90z" fill="#c8102e"/>
  <path d="M66 90h10v9H66zM116 90h10v9h-10z" fill="#c8102e"/>
  <path d="M118 96l10 30-12 2-6-28z" fill="#00843d"/>
  <path d="M120 106l6 14" stroke="#c8102e" stroke-width="4"/>

  <!-- cabeça -->
  <circle cx="88" cy="60" r="27" fill="url(#gtBody)"/>
  <!-- crista -->
  <path d="M70 40c-4-12 6-20 12-12 0-14 14-16 16-4 4-10 18-6 14 6 8-2 12 8 4 14-12-4-34-6-46-4z" fill="url(#gtRed)"/>
  <!-- bico -->
  <path d="M62 58 42 66l20 6z" fill="url(#gtGold)"/>
  <path d="M42 66l20 0" stroke="#d48a00" stroke-width="1.5"/>
  <!-- barbela -->
  <path d="M60 72c-2 12 6 18 12 10 0-6-4-10-12-10z" fill="url(#gtRed)"/>
  <!-- olho -->
  <circle cx="80" cy="54" r="9" fill="#fff"/>
  <circle cx="77" cy="55" r="5" fill="#111"/>
  <circle cx="75.5" cy="53" r="1.8" fill="#fff"/>
  <path d="M70 43c5-3 12-3 17 1" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- bola -->
  <circle cx="146" cy="186" r="20" fill="#fff"/>
  <path d="M146 176l9 6-3 11h-12l-3-11z" fill="#111"/>
  <path d="M146 166v10M155 182l10-4M152 193l7 9M140 193l-7 9M137 182l-10-4" stroke="#111" stroke-width="2"/>
  <circle cx="146" cy="186" r="20" fill="none" stroke="#111" stroke-width="2"/>
</svg>
